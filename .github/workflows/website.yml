name: Publicar Thronepath
on:
  push:
    branches: [main]
    paths: ['website/**', 'scripts/**', 'source/**', 'tests/website-*.cjs', '.github/workflows/website.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: thronepath-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar site a partir do jogo original
        run: python3 scripts/build-website.py
      - name: Verificar viewport, controles e preferências
        run: |
          node tests/website-viewport.cjs
          GAME_HTML=website-dist/index.html node tests/website-canvas.cjs
          GAME_HTML=website-dist/index.html node tests/options1612.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website-dist
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
