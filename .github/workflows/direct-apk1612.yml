name: Publicar APK Thronepath 1.6.12
on:
  push:
    branches: [apk-download-1-6-12]
    paths: ['distribution/1.6.12/**', '.github/workflows/direct-apk1612.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir APK assinado
        run: |
          cat distribution/1.6.12/part-1.bin distribution/1.6.12/part-2.bin > Thronepath_v1_6_12.apk
          echo 'cd1fa5b69b8044c3f0b3f50766313bd74aef5ef2b99fc5534426ec21e5e7f530  Thronepath_v1_6_12.apk' | sha256sum --check --strict
      - name: Publicar download direto
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload v1.6.12 Thronepath_v1_6_12.apk --clobber
