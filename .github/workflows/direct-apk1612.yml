name: Publicar APK Thronepath 1.6.12
on:
  push:
    branches: [apk-download-1-6-12]
    paths: ['distribution/1.6.12/**', '.github/workflows/direct-apk1612.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir APK assinado
        run: |
          cat distribution/1.6.12/part-1.bin distribution/1.6.12/part-2.bin > Thronepath_v1_6_12.apk
          echo 'eb5360ea3636cc7b876f48b4ec22ef1fcd7d291ca1525b2da579b4b850a2f8cb  Thronepath_v1_6_12.apk' | sha256sum --check --strict
      - name: Publicar download direto
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v1.6.12 Thronepath_v1_6_12.apk
          --target d191bd8b31d05b048485c5535ac4a4de370edf86
          --title 'Thronepath 1.6.12' --latest
          --notes 'Menu ajustado para telas com a barra do navegador, sem cobrir o logo. Textos das conquistas com quebra de linha. Comandos de andar e pular preservados durante o reaparecimento. Espinhos retráteis sem peças cinzas; algumas barreiras de fogo e espinhos exigem esperar e lasers ampliados. Menos atualizações repetidas dos contadores. P: pausa; M: início. Progresso, cenários e final mantidos. APK com assinatura permanente e versão 1.6.12.'
