name: Gerar APK Thronepath
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Montar HTML completo
        run: |
          python3 scripts/assemble-game.py
          python3 scripts/upgrade160.py
          python3 scripts/upgrade161.py
          python3 scripts/upgrade163.py
          python3 scripts/upgrade164.py
          python3 scripts/upgrade165.py
          python3 scripts/package-android-web.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias de teste
        run: npm install --ignore-scripts
      - name: Testar jogo completo
        run: |
          node tests/changes.cjs
          node tests/integration.cjs
          node tests/geometry.cjs
          node tests/spring_routes.cjs
          node tests/routes.cjs
          node tests/encounters.cjs
          node tests/control_alignment.cjs
          node tests/revision152.cjs
          node tests/revision160.cjs
          node tests/revision161.cjs
          node tests/revision165.cjs
          node tests/pendulum163.cjs
          node tests/quality163.cjs
          node tests/dynamics164.cjs
          node tests/update-notice.cjs
          node tests/background160.cjs
          node tests/review_regressions.cjs
      - name: Testar navegador e telas pequenas
        run: |
          npx playwright install --with-deps chromium
          timeout 180 node tests/browser165.cjs
          THRONEPATH_PACKAGED=1 timeout 180 node tests/browser160.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Thronepath-visual-QA
          path: previews/browser165/
          retention-days: 14
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Testar politica de atualizacao
        run: |
          javac -d /tmp/update-tests app/src/main/java/com/lucasrodrigues/thronepath/UpdatePolicy.java tests/UpdatePolicyTest.java
          java -cp /tmp/update-tests UpdatePolicyTest
          javac -d /tmp/update-tests app/src/main/java/com/lucasrodrigues/thronepath/InstallPolicy.java tests/InstallPolicyTest.java
          java -cp /tmp/update-tests InstallPolicyTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Preparar Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Preparar assinatura, se configurada
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.THRONEPATH_KEYSTORE_BASE64 }}
          THRONEPATH_STORE_PASSWORD: ${{ secrets.THRONEPATH_STORE_PASSWORD }}
          THRONEPATH_KEY_ALIAS: ${{ secrets.THRONEPATH_KEY_ALIAS }}
          THRONEPATH_KEY_PASSWORD: ${{ secrets.THRONEPATH_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$THRONEPATH_STORE_PASSWORD" ] && [ -n "$THRONEPATH_KEY_ALIAS" ] && [ -n "$THRONEPATH_KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/thronepath-release.jks"
            printf 'release=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'release=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Compilar APK completo
        env:
          SIGNED_RELEASE: ${{ steps.signing.outputs.release }}
          THRONEPATH_STORE_PASSWORD: ${{ secrets.THRONEPATH_STORE_PASSWORD }}
          THRONEPATH_KEY_ALIAS: ${{ secrets.THRONEPATH_KEY_ALIAS }}
          THRONEPATH_KEY_PASSWORD: ${{ secrets.THRONEPATH_KEY_PASSWORD }}
        run: |
          if [ "$SIGNED_RELEASE" = 'true' ]; then
            export THRONEPATH_KEYSTORE_FILE="$RUNNER_TEMP/thronepath-release.jks"
            gradle --no-daemon :app:assembleRelease
          else
            gradle --no-daemon -PallowUnsignedRelease :app:assembleRelease
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Thronepath-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Android-signing-tool
          path: /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error
          retention-days: 7

